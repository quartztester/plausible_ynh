version = "1.0"

[main]

    [main.registration]
    name = "Registration"

        [main.registration.disable_registration]
        ask = "Registration policy"
        type = "select"
        choices = ["invite_only", "true", "false"]
        default = "invite_only"
        help = "Who can create a Plausible account: invite_only (new users join by invitation), true (registration fully disabled), false (open registration)."
        bind = "DISABLE_REGISTRATION:__INSTALL_DIR__/env"

        [main.registration.admin_email]
        ask = "Admin contact email"
        type = "string"
        help = "Used for Plausible's outgoing mail (password resets, invitations) via the server's local Postfix."
        bind = "admin_email"
