#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "plausible"
name = "Plausible Analytics"
description.en = "Simple, privacy-friendly and lightweight web analytics (self-hosted Community Edition)"

version = "3.2.1~ynh7"

maintainers = ["quartztester"]

[upstream]
license = "AGPL-3.0-only"
website = "https://plausible.io/"
code = "https://github.com/plausible/analytics"
admindoc = "https://github.com/plausible/community-edition/wiki"
userdoc = "https://plausible.io/docs"

[integration]
yunohost = ">= 12.0"
helpers_version = "2.1"
# Release bundles its own ERTS built for Debian 12 amd64; rebuild before listing other arches.
architectures = ["amd64"]
multi_instance = true
ldap = "not_relevant"
sso = "not_relevant"
disk = "3G"
ram.build = "4G"
ram.runtime = "2G"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/"

    [install.init_main_permission]
    type = "group"
    default = "visitors"
    help.en = "Must stay 'visitors': measured websites send events and load the tracker script anonymously. The stats dashboard itself is protected by Plausible's own login."

    [install.admin]
    type = "user"
    help.en = "YunoHost user whose email will receive Plausible's password reset emails and the first-launch registration."

    [install.admin_email]
    ask.en = "Admin contact email (Plausible account email / password resets)"
    help.en = "Address used for Plausible's outgoing mail and where the initial registration link is sent. Defaults to the chosen YunoHost admin user's email."
    type = "string"
    optional = true

    [install.disable_registration]
    ask.en = "Registration policy"
    help.en = "invite_only (CE default): new users can register by invite from an existing user. true: no new users. false: open registration."
    type = "select"
    choices.invite_only = "invite_only (recommended)"
    choices.true = "true (no new users)"
    choices.false = "false (open registration)"
    default = "invite_only"

[resources]
    [resources.system_user]
    # Elixir release runs as a service user; ClickHouse keeps its own deb user.

    [resources.install_dir]
    owner = "__APP__:rwx"
    group = "__APP__:rx"

    [resources.data_dir]
    subdirs = ["geodb", "sessions", "tmp"]
    owner = "__APP__:rwx"
    group = "__APP__:rwx"

    [resources.permissions]
    # Public surface (tracker, events, shared stats): measured-site browsers must never hit the portal.
    main.url = "/"
    main.auth_header = false

    # Everything else is the private dashboard/API behind the YunoHost SSO.
    # SSOwat's JWT-verified YNH_USER* headers let YunohostSSOPlug auto-login the matching account by email.
    dashboard.url = "re:^__DOMAIN__\\/(?!js\\/|css\\/|images\\/|favicon\\.ico|robots\\.txt|live\\/|api\\/|share\\/|avatar\\/).*$"
    dashboard.protected = true
    dashboard.allowed = ["all_users"]
    # Regex URLs cannot render a portal tile; the tile comes from `main`.
    dashboard.show_tile = false

    [resources.ports]
    # Plausible HTTP (nginx -> app); both bound to loopback only.
    main.default = 8000

    [resources.apt]
    # ClickHouse 24.12 from the upstream repo, pinned like CE's compose stack; removed after install so apt never moves it.
    packages = ["postgresql", "postgresql-contrib", "brotli"]
    # ClickHouse is provisioned from the upstream repo in _common.sh
    # (_plausible_install_clickhouse) — the apt-extras helper mangles
    # pkg=ver pins into unparseable "pkg (= ver)" tokens.

    [resources.database]
    type = "postgresql"

    [resources.sources.main]
    # Native Elixir/OTP release of CE v3.2.1 (MIX_ENV=ce, Debian 12 amd64, OTP 27 + Elixir 1.19 + Node 22); bundles its own ERTS.
    # Maintainers: rebuild per upstream tag (doc/ADMIN.md); update url + sha256 + version together.
    in_subdir = true
    amd64.url = "https://github.com/quartztester/plausible_ynh/releases/download/v3.2.1-ynh1/plausible-3.2.1-x86_64-linux-gnu-bookworm.tar.gz"
    amd64.sha256 = "86e4eae831f3465383e048203a7ecb8633400b486d6fe8dcbb68481daa67bd46"
